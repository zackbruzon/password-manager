<!DOCTYPE html>

<html>
    <head>
        <!-- Sets the title of the tab -->
        <title>Password Manager</title>

        <!-- Sets the stylesheet for the page -->
        <link rel="stylesheet" href="/style.css">

        <!-- Imports FontAwesome icons -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
        <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/js/all.min.js"></script>

        <style>
            h1, h4, a, label {
                font-family: Verdana, Geneva, Tahoma, sans-serif;
            }

            h3 {
                font-family: Verdana, Geneva, Tahoma, sans-serif;
            }

            p {
                font-family: Verdana, Geneva, Tahoma, sans-serif;
            }

            button {
                font-family: Verdana, Geneva, Tahoma, sans-serif;
            }

            .signUpTip {
                border: 1%;
                border-color: black;
                border-style: outset;
                border-radius: 10%;
                width: 20%;
                margin-left: 40%;
            }
        </style>

        <!-- Loads the script shown above this -->
        <script src="/password.js" defer></script>
    </head>

    <body style="text-align: center;">
        <h1>Password Manager</h1>
        <hr>
        <h3><a href="/dashboard">Return to dashboard</a></h3>
        <hr>

        <div id="passwordInfoOuter">
            <div id="passwordInfo"></div>
            <br>
            <button onclick="showEditForm();">Edit Password</button>
            <button onclick="deletePassword();">Delete Password</button>
        </div>

        <div id="editPassword" hidden>
            <h3>Edit Password</h3>
            <br>

            <p>
                Name
                <br>
                <input id="editPasswordName"></input>
            </p>

            <p>
                Icon
                <br>
                <select id="editPasswordIcon">
                    <option value="none">None</option>
                </select>
            </p>
            
            <input type="checkbox" id="useGeneratedPassword" onclick="passwordTypeChanged();">
            <label for="useGeneratedPassword">Use generated password</label>

            <p id="userPassword">
                Password
                <br>
                <input id="editPasswordBox" type="password"></input>
            </p>

            <div id="generatedPassword" hidden>
                <p>
                    Password
                    <br>
                    <input id="generatedPasswordValue" disabled></input>
                </p>

                <p>
                    Configuration
                    <br>
                    <input style="width: 10%;" type="number" min="0" max="64" id="letterCount" placeholder="Letters (1-64)" onchange="generatePassword();">
                    <br>
                    <input style="width: 10%;" type="number" min="0" max="64" id="numberCount" placeholder="Numbers (1-64)" onchange="generatePassword();">
                    <br>
                    <input style="width: 10%;" type="number" min="0" max="64" id="punctuationCount" placeholder="Punctuation (1-64)" onchange="generatePassword();">
                </p>
            </div>

            <button id="passwordButton" onclick="editPassword();">Submit</button>
            <button onclick="hideEditForm();">Cancel</button>
        </div>
    </body>
</html>
